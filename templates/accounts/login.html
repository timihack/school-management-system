{% load static %}
<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log in - School Management System</title>
  <link rel="stylesheet" href="{% static 'css/dist/output.css' %}" />
</head>
<body class="h-full bg-slate-50 flex items-center justify-center">
  <div class="w-full max-w-sm bg-white rounded-xl shadow-sm border border-slate-200 p-8">
    <h1 class="text-xl font-semibold text-slate-800 mb-6 text-center">
      School<span class="text-indigo-600">MS</span>
    </h1>

    {% if form.errors %}
    <div class="mb-4 rounded-lg bg-red-50 border border-red-200 text-red-700 text-sm px-3 py-2">
      Invalid username or password.
    </div>
    {% endif %}

    <!--
      Plain full-page POST, deliberately NOT HTMX-enhanced. Login changes
      the session cookie and must redirect somewhere new afterward - an
      HTMX partial swap would need special handling for that redirect
      and buys nothing here, since the whole page has to navigate away
      regardless. HTMX earns its place on CRUD screens within the app
      shell (Students, Fees, etc.), not on the auth boundary itself.
    -->
    <form method="post" class="space-y-4">
      {% csrf_token %}
      <div>
        <label class="block text-sm font-medium text-slate-600 mb-1">Username</label>
        {{ form.username }}
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-600 mb-1">Password</label>
        {{ form.password }}
      </div>
      <input type="hidden" name="next" value="{{ next }}">
      <button type="submit"
        class="w-full bg-indigo-600 text-white rounded-lg py-2 text-sm font-medium hover:bg-indigo-700">
        Log in
      </button>
    </form>
  </div>
</body>
</html>
