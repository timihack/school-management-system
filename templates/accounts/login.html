{% load static %}
<!DOCTYPE html>
<html lang="en" class="h-full"
      x-data="{ dark: localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches) }"
      x-init="document.documentElement.classList.toggle('dark', dark)">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log in - School Management System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/dist/output.css' %}" />
  <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="h-full bg-canvas dark:bg-canvas-dark font-sans flex items-center justify-center transition-colors">
  <div class="w-full max-w-sm bg-white dark:bg-slate-900 rounded-xl shadow-sm border border-slate-200 dark:border-slate-800 p-8">
    <h1 class="font-display text-2xl font-semibold text-ink-700 dark:text-white mb-6 text-center">
      School<span class="text-seal-gold">MS</span>
    </h1>

    {% if form.errors %}
    <div class="mb-4 rounded-lg bg-alert-soft border border-alert/20 text-alert text-sm px-3 py-2">
      Invalid username or password.
    </div>
    {% endif %}

    <!--
      Plain full-page POST, deliberately NOT HTMX-enhanced. Login changes
      the session cookie and must redirect somewhere new afterward - an
      HTMX partial swap would need special handling for that redirect
      and buys nothing here, since the whole page has to navigate away
      regardless. HTMX earns its place on CRUD screens within the app
      shell (Students, Fees, etc.), not on the auth boundary itself.
    -->
    <form method="post" class="space-y-4">
      {% csrf_token %}
      <div>
        <label class="block text-sm font-medium text-slate-600 dark:text-slate-300 mb-1">Username</label>
        {{ form.username }}
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-600 dark:text-slate-300 mb-1">Password</label>
        {{ form.password }}
      </div>
      <input type="hidden" name="next" value="{{ next }}">
      <button type="submit"
        class="w-full bg-ink-700 text-white rounded-lg py-2.5 text-sm font-medium hover:bg-ink-800 transition-colors">
        Log in
      </button>
    </form>
  </div>
</body>
</html>
