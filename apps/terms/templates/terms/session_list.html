{% extends "base.html" %}

{% block content %}
<div class="flex items-center justify-between mb-5">
  <h1 class="font-display text-2xl font-semibold text-ink-700 dark:text-white">Academic Sessions</h1>
  {% if request.user.role == "ADMIN" %}
  <a href="{% url 'terms:session_create' %}"
     class="bg-ink-700 text-white rounded-lg px-4 py-2 text-sm font-medium hover:bg-ink-800 transition-colors">
    + Add Session
  </a>
  {% endif %}
</div>

<div class="mb-4">
  <input type="text" name="search" value="{{ filters.search }}"
         placeholder="Search by session name..."
         class="w-full rounded-lg border border-slate-300 dark:border-slate-700 dark:bg-slate-900 dark:text-slate-200 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-ink-600"
         hx-get="{% url 'terms:session_list' %}"
         hx-target="#session-table-container"
         hx-trigger="input changed delay:400ms, search">
</div>

<div id="session-table-container">
  {% include "terms/partials/session_table.html" %}
</div>
{% endblock %}
