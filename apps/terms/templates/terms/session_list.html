{% extends "base.html" %}

{% block content %}
<div class="flex items-center justify-between mb-4">
  <h1 class="text-xl font-semibold text-slate-800">Academic Sessions</h1>
  {% if request.user.role == "ADMIN" %}
  <a href="{% url 'terms:session_create' %}"
     class="bg-indigo-600 text-white rounded-lg px-4 py-2 text-sm font-medium hover:bg-indigo-700">
    + Add Session
  </a>
  {% endif %}
</div>

<div class="mb-4">
  <input type="text" name="search" value="{{ filters.search }}"
         placeholder="Search by session name..."
         class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm"
         hx-get="{% url 'terms:session_list' %}"
         hx-target="#session-table-container"
         hx-trigger="input changed delay:400ms, search">
</div>

<div id="session-table-container">
  {% include "terms/partials/session_table.html" %}
</div>
{% endblock %}
